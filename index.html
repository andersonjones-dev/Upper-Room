<!doctype html>
<html lang="en" class="glass">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Upper Room">
  <meta name="theme-color" content="#F4EFE6">
  <meta name="description" content="Bible party games where everyone plays on their own phone.">
  <title>Upper Room</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before the first paint so the screen never flashes another theme.
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('ur.prefs')) || {};
        var t = ['cyber', 'glass'].indexOf(p.theme) >= 0 ? p.theme : 'glass';
        var m = p.mode || 'auto';
        var dark = m === 'dark' || (m === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.className = t + (dark ? ' dark' : '');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="app" id="app">
    <main id="view" class="scr" aria-live="polite"></main>
    <div id="overlay"></div>
    <div id="bar"></div>
  </div>
  <noscript><p style="padding:24px">Upper Room needs JavaScript turned on.</p></noscript>
  <script type="module" src="js/app.js"></script>
<script src="install.js" data-app="Upper Room" data-shrink=".app"></script>
</body>
</html>
